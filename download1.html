<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تحميل تطبيق معدودات">

    <title>تحميل تطبيق معدودات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'TheYearofHandicrafts';
            src: url('https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/TheYearofHandicrafts-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.95);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #c5a880;
            --border-color: rgba(255, 255, 255, 0.12);
            --btn-blue: #0052cc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'TheYearofHandicrafts', 'Tajawal', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(2, 132, 199, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(197, 168, 128, 0.06) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .download-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid var(--border-color);
            border-radius: 28px;
            padding: 50px 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .app-logo {
            width: 110px;
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        .download-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .download-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.8;
        }

        .countdown-circle {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.06);
            border: 3px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 25px rgba(197, 168, 128, 0.3);
            margin: 10px 0;
            animation: pulseGlow 1s infinite alternate;
        }

        @keyframes pulseGlow {
            from { transform: scale(1); box-shadow: 0 0 15px rgba(197, 168, 128, 0.2); }
            to { transform: scale(1.05); box-shadow: 0 0 30px rgba(197, 168, 128, 0.5); }
        }

        .download-btn {
            background: var(--btn-blue);
            border: 2px solid transparent;
            color: white;
            padding: 16px 35px;
            border-radius: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(0, 82, 204, 0.5);
            width: 100%;
            justify-content: center;
        }

        .download-btn:hover, .download-btn:focus {
            background: #0066ff;
            border-color: #fff;
            transform: scale(1.03);
            outline: none;
        }

        .status-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="download-card">
        <img src="https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/numbered.png" alt="شعار معدودات" class="app-logo">
        
        <h1 class="download-title">تحميل تطبيق معدودات</h1>
        
        <p class="download-desc" id="statusDesc">سيتم بدء التحميل التلقائي للتطبيق خلال اللحظات القادمة...</p>

        <div class="countdown-circle" id="counterNum">3</div>

        <a href="https://files.catbox.moe/t8afob.apk" class="download-btn" id="manualBtn">
            <i class="fa-solid fa-download"></i>
            <span>تحميل مباشر الآن</span>
        </a>

        <div class="status-text">إصدار التلفزيون والأجهزة الذكية v1.0.6</div>
    </div>

    <script>
        const apkUrl = "https://files.catbox.moe/t8afob.apk";
        let timeLeft = 3;
        const counterEl = document.getElementById("counterNum");
        const statusDesc = document.getElementById("statusDesc");

        const countdownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                counterEl.innerText = timeLeft;
            } else {
                clearInterval(countdownInterval);
                counterEl.innerText = "✓";
                statusDesc.innerText = "جاري بدء تنزيل الملف الآن...";
                
                // بدء التحميل التلقائي
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = apkUrl;
                document.body.appendChild(iframe);
            }
        }, 1000);
    </script>
</body>
</html>
