<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b14">
<meta name="description" content="مركز إدارة معدودات: الإشعارات والجداول">
<title>مركز إدارة معدودات</title>
<link rel="icon" href="https://file.garden/aoLQp-Z9knG33grX/شعارات%20الصور/numbered.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"KoGhorab";src:url("https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/ko-ghorab.otf") format("opentype");font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--bg:#090b14;--panel:#141725;--line:#30364d;--text:#f4f4fb;--muted:#9298ae;--accent:#a99fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;background:radial-gradient(ellipse at top,#29234d 0,transparent 55%),var(--bg);color:var(--text);font-family:"KoGhorab",Tajawal,Arial,sans-serif;display:grid;place-items:center}
main{width:min(100%,760px)}header{text-align:center;margin-bottom:28px}header img{width:88px;height:88px;object-fit:contain}h1{font-size:30px;margin:8px 0 4px}header p{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
a.card{display:flex;min-height:190px;flex-direction:column;justify-content:space-between;padding:22px;border:1px solid #343b58;border-radius:24px;background:linear-gradient(145deg,rgba(29,33,54,.98),rgba(15,19,32,.98));box-shadow:0 16px 40px #0003;color:inherit;text-decoration:none;transition:.18s}
a.card:hover{transform:translateY(-3px);border-color:#7569d9;background:linear-gradient(145deg,#242044,#141827)}
.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#29234d;color:var(--accent);font-size:25px}
h2{font-size:21px;margin:18px 0 5px} .desc{color:var(--muted);font-size:14px;line-height:1.8}.open{font-size:13px;color:#c9c2ff;margin-top:12px}
.back{display:block;text-align:center;color:var(--muted);margin:22px auto 0;text-decoration:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}a.card{min-height:155px}h1{font-size:26px}}
</style>
</head>
<body><main>
<header>
<img src="https://file.garden/aoLQp-Z9knG33grX/شعارات%20الصور/numbered.png" alt="معدودات">
<h1>مركز إدارة معدودات</h1>
<p>بوابتك الموحدة لإدارة خدمات معدودات</p>
</header>
<section class="grid" aria-label="خدمات الإدارة">
<a class="card" href="/notifications/" target="_blank" rel="noopener">
<div><div class="icon" aria-hidden="true">♧</div><h2>مركز الإشعارات</h2><div class="desc">إرسال الإشعارات وجدولتها، ومراجعة الأرشيف وإدارة الملفات.</div></div>
<div class="open">فتح مركز الإشعارات ←</div>
</a>
<a class="card" href="/sheets/" target="_blank" rel="noopener">
<div><div class="icon" aria-hidden="true">▦</div><h2>الجداول</h2><div class="desc">إنشاء الجداول والأوراق وتحرير الخلايا وحفظ التعديلات.</div></div>
<div class="open">فتح الجداول ←</div>
</a>
</section>
<a class="back" href="/">العودة إلى موقع معدودات</a>
</main></body></html>
