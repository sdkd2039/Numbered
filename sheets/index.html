<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d18"><title>جداول معدودات</title>
<style>
@font-face{font-family:"KoGhorab";src:url("https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/ko-ghorab.otf") format("opentype");font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--bg:#090b14;--panel:#141725;--panel2:#0d1120;--line:#30364d;--muted:#9298ae;--text:#f4f4fb;--accent:#796dff;--accent2:#5145c8;--green:#8ff0bd;--red:#ffb5c2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#222044 0,transparent 55%),var(--bg);color:var(--text);font-family:"KoGhorab",Tajawal,Arial,sans-serif;padding:18px;min-height:100vh;letter-spacing:0}
button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:auto}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top h1{font-size:22px;margin:0}.top p{color:var(--muted);font-size:12px;margin:5px 0 0}.top .spacer{flex:1}.btn{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#8b7fff,#5c50d5);font-weight:700;box-shadow:0 7px 18px #6254d533;color:white}.btn.alt{background:#252044;border:1px solid #514b91;color:#d4d0ff}.btn:disabled{opacity:.5;cursor:not-allowed}.panel{background:linear-gradient(145deg,rgba(26,30,49,.96),rgba(17,21,35,.96));border:1px solid #343b58;border-radius:20px;padding:19px;margin-bottom:16px;box-shadow:0 14px 38px #0003}.auth{max-width:430px;margin:9vh auto}.auth h2{margin:0 0 8px}.muted,.help{color:var(--muted);font-size:13px;line-height:1.8}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:13px;color:#dedff0}.field input,.select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .grow{flex:1;min-width:180px}.status{font-size:13px;line-height:1.8;margin-top:10px}.status.error{color:var(--red)}.status.ok{color:var(--green)}[hidden]{display:none!important}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select{max-width:260px}.toolbar input{max-width:220px}.sheet-tabs{display:flex;gap:6px;overflow:auto;margin-top:12px}.sheet-tab{white-space:nowrap;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--panel2);color:#d8d8e8}.sheet-tab.active{background:#29234d;border-color:var(--accent);color:white}
.grid-wrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:10px;margin-top:12px;background:#0d1120}.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%}.grid th,.grid td{border-inline-end:1px solid #292e43;border-bottom:1px solid #292e43;min-width:125px;height:36px;padding:0}.grid th{position:sticky;top:0;background:#1b1f33;color:#bdb9f7;font-size:12px;z-index:2}.grid th:first-child{left:0;right:0;z-index:3;min-width:42px;width:42px}.grid td:first-child{position:sticky;right:0;z-index:1;background:#171b2e;color:var(--muted);text-align:center;font-size:11px;min-width:42px;width:42px}.grid td input{width:100%;height:35px;border:0;border-radius:0;background:transparent;color:white;padding:7px 9px;outline:none;font-size:13px}.grid td input:focus{background:#201d42;box-shadow:inset 0 0 0 2px var(--accent)}.grid td.dirty input{background:#29234d}.grid td.selected{outline:2px solid var(--accent);outline-offset:-2px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#123528;color:var(--green);padding:11px 16px;border-radius:10px;box-shadow:0 8px 30px #0009;z-index:5;font-size:13px}
@media(max-width:600px){body{padding:10px}.top h1{font-size:19px}.panel{padding:12px}.grid th,.grid td{min-width:110px}.toolbar>*{flex:1}.toolbar select{max-width:none}}
</style></head><body><div class="wrap">
<header class="top"><div><h1>جداول معدودات</h1><p>مساحة جداول خاصة — احفظ تعديلاتك أولًا بأول</p></div><span class="spacer"></span><a class="btn alt" href="/hub.html">مركز إدارة معدودات</a><button id="logout" class="btn alt" hidden>تسجيل الخروج</button></header>
<section id="auth" class="panel auth"><h2 id="authTitle">تسجيل الدخول</h2><p id="authHelp" class="muted">أدخل حساب الجداول للمتابعة.</p>
<div class="field"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" maxlength="40"></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div>
<div id="bootstrapFields" hidden><div class="field"><label for="bootstrapSecret">رمز التهيئة (مرة واحدة فقط)</label><input id="bootstrapSecret" type="password" autocomplete="off"></div><p class="help">يظهر هذا الخيار إذا لم يكن حساب الإدارة قد أُنشئ بعد. أدخل السر الذي أعددته في Cloudflare باسم SHEETS_BOOTSTRAP_SECRET.</p></div>
<div class="row"><button id="login" class="btn">دخول</button><button id="showBootstrap" class="btn alt" type="button">إنشاء الحساب الأول</button></div><div id="authStatus" class="status"></div></section>
<section id="app" hidden>
<div class="panel"><div class="toolbar"><select id="workbooks" class="select grow" aria-label="اختر الجدول"></select><button id="newBook" class="btn">جدول جديد</button><button id="newSheet" class="btn alt">ورقة جديدة</button><button id="save" class="btn" disabled>حفظ التعديلات</button></div><div id="sheetTabs" class="sheet-tabs"></div><div class="grid-wrap"><table id="grid" class="grid" aria-label="شبكة خلايا الجدول"></table></div>
<div class="bottom"><span id="saveState" class="muted">جاهز</span><span class="muted">20 صفًا ظاهرة · 12 عمودًا · استخدم Tab للتنقل</span></div><div id="appStatus" class="status"></div></div>
</section></div><div id="toast" class="toast" hidden></div>
<script>
const $=id=>document.getElementById(id), API='https://numbered-notify.sultan2021alamoudi.workers.dev/api/sheets', ROWS=20, COLS=12;
let token='',books=[],sheets=[],activeSheet='',cells=new Map(),dirty=new Map(),toastTimer;
const key=(r,c)=>r+':'+c;
function notify(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2400)}
function status(id,msg,error=false){$(id).textContent=msg;$(id).className='status '+(error?'error':'ok')}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(token)headers.Authorization='Bearer '+token;const res=await fetch(API+path,{...opts,headers});let data={};try{data=await res.json()}catch{}if(!res.ok||data.success===false)throw Error(data.message||'تعذر تنفيذ الطلب');return data}
function showApp(on){$('auth').hidden=on;$('app').hidden=!on;$('logout').hidden=!on}
function setBootstrap(on){$('bootstrapFields').hidden=!on;$('authTitle').textContent=on?'إنشاء حساب الإدارة الأول':'تسجيل الدخول';$('authHelp').textContent=on?'أنشئ حسابًا خاصًا لإدارة جداولك.':'أدخل حساب الجداول للمتابعة.';$('login').textContent=on?'إنشاء الحساب':'دخول';$('showBootstrap').textContent=on?'العودة لتسجيل الدخول':'إنشاء الحساب الأول'}
$('showBootstrap').onclick=()=>setBootstrap($('bootstrapFields').hidden);
$('login').onclick=async()=>{const username=$('username').value.trim(),password=$('password').value,boot=!$('bootstrapFields').hidden;try{if(!username||!password)throw Error('أدخل اسم المستخدم وكلمة المرور.');$('login').disabled=true;if(boot){await api('/auth/bootstrap',{method:'POST',body:JSON.stringify({username,password,bootstrapSecret:$('bootstrapSecret').value})});setBootstrap(false);status('authStatus','تم إنشاء الحساب. سجّل الدخول الآن.');return}const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username,password})});token=d.token;sessionStorage.setItem('sheets_token',token);showApp(true);await loadBooks()}catch(e){status('authStatus',e.message,true)}finally{$('login').disabled=false}};
$('logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST',body:'{}'})}catch{}token='';sessionStorage.removeItem('sheets_token');showApp(false)};
async function loadBooks(){const d=await api('/workbooks');books=d.workbooks||[];$('workbooks').innerHTML='';books.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.title;$('workbooks').append(o)});if(!books.length){$('grid').innerHTML='';$('sheetTabs').innerHTML='';$('saveState').textContent='أنشئ جدولًا للبدء';return}await chooseBook(books[0].id)}
async function chooseBook(id){const d=await api('/workbooks/'+id+'/sheets');sheets=d.sheets||[];$('sheetTabs').innerHTML='';sheets.forEach(s=>{const b=document.createElement('button');b.className='sheet-tab'+(s.id===activeSheet?' active':'');b.textContent=s.title;b.onclick=()=>openSheet(s.id);$('sheetTabs').append(b)});if(sheets.length)await openSheet(sheets[0].id)}
async function openSheet(id){activeSheet=id;dirty.clear();$('save').disabled=true;const d=await api('/sheets/'+id+'/cells');cells=new Map();(d.cells||[]).forEach(c=>cells.set(key(c.row_index,c.column_index),c.value??c.formula??''));$('sheetTabs').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',sheets[i]?.id===id));renderGrid();$('saveState').textContent='تم تحميل الورقة'}
function colName(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
function renderGrid(){const t=$('grid');t.innerHTML='';const head=document.createElement('tr');const blank=document.createElement('th');blank.textContent='#';head.append(blank);for(let c=0;c<COLS;c++){const th=document.createElement('th');th.textContent=colName(c);head.append(th)}t.append(head);for(let r=0;r<ROWS;r++){const tr=document.createElement('tr'),n=document.createElement('td');n.textContent=r+1;tr.append(n);for(let c=0;c<COLS;c++){const td=document.createElement('td'),inp=document.createElement('input'),k=key(r,c);inp.value=dirty.has(k)?dirty.get(k):cells.get(k)||'';inp.setAttribute('aria-label',colName(c)+(r+1));inp.dataset.row=r;inp.dataset.col=c;inp.oninput=()=>{dirty.set(k,inp.value);td.classList.add('dirty');$('save').disabled=false;$('saveState').textContent='توجد تعديلات غير محفوظة'};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const next=t.querySelector('input[data-row="'+(r+1)+'"][data-col="'+c+'"]');if(next)next.focus()}if(e.key==='Tab'&&!e.shiftKey&&c===COLS-1&&r===ROWS-1){e.preventDefault();notify('وصلت إلى نهاية مساحة العرض الحالية')}};td.append(inp);tr.append(td)}t.append(tr)}}
$('workbooks').onchange=e=>chooseBook(e.target.value).catch(e=>status('appStatus',e.message,true));
$('newBook').onclick=async()=>{const title=prompt('اسم الجدول الجديد:');if(!title?.trim())return;try{const d=await api('/workbooks',{method:'POST',body:JSON.stringify({title:title.trim()})});await loadBooks();$('workbooks').value=d.workbook.id;await chooseBook(d.workbook.id);notify('تم إنشاء الجدول')}catch(e){status('appStatus',e.message,true)}};
$('newSheet').onclick=async()=>{if(!$('workbooks').value)return notify('أنشئ جدولًا أولًا');const title=prompt('اسم الورقة الجديدة:');if(!title?.trim())return;try{await api('/workbooks/'+$('workbooks').value+'/sheets',{method:'POST',body:JSON.stringify({title:title.trim()})});await chooseBook($('workbooks').value);notify('تم إنشاء الورقة')}catch(e){status('appStatus',e.message,true)}};
$('save').onclick=async()=>{if(!dirty.size||!activeSheet)return;const batch=[...dirty.entries()].map(([k,value])=>{const [row,column]=k.split(':').map(Number);return{row,column,value}});try{$('save').disabled=true;for(let i=0;i<batch.length;i+=300)await api('/sheets/'+activeSheet+'/cells',{method:'PUT',body:JSON.stringify({cells:batch.slice(i,i+300)})});batch.forEach(c=>cells.set(key(c.row,c.column),c.value));dirty.clear();renderGrid();$('saveState').textContent='تم الحفظ';notify('تم حفظ التعديلات')}catch(e){$('save').disabled=false;status('appStatus',e.message,true)}};
function start(){try{token=sessionStorage.getItem('sheets_token')||''}catch{}if(!token)return showApp(false);api('/workbooks').then(()=>{showApp(true);loadBooks()}).catch(()=>{sessionStorage.removeItem('sheets_token');token='';showApp(false)})}
start();
</script></body></html>
