            font-weight: bold;
            font-style: normal;
        }

        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.75);
            --text-color: #f8fafc;
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --text-muted: #94a3b8;
            --accent-gold: #c5a880;
            --player-bg: #151f32;
            --border-color: rgba(255, 255, 255, 0.1);
            --tab-active: #0052cc;
            --green: #238636;
            --live-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'TheYearofHandicrafts', 'Tajawal', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(2, 132, 199, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(197, 168, 128, 0.06) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* شاشة المقدمة الاحترافية (Splash Screen) المتجاوبة */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            overflow: hidden;
        }

        .splash-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
        }

        .splash-mobile { display: block; }
        .splash-desktop { display: none; }

        @media (min-width: 768px) {
            .splash-mobile { display: none; }
            .splash-desktop { display: block; }
        }

        img { pointer-events: none; -webkit-touch-callout: none; }
        header { text-align: center; margin-bottom: 20px; }
        .main-logo { max-width: 150px; height: auto; transition: transform 0.2s ease; }

        .tabs-wrapper { width: 100%; display: flex; justify-content: center; margin-bottom: 30px; }
        .tabs-container { 
            display: flex; 
            gap: 15px; 
            overflow-x: auto; 
            padding: 8px; 
            scrollbar-width: none; 
            background: rgba(22, 27, 34, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: rgba(33, 38, 45, 0.5); 
            border: 1px solid var(--border-color); 
            color: var(--text-color);
            padding: 12px 18px; 
            border-radius: 16px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer;
            white-space: nowrap; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            min-width: 90px;
            transition: all 0.25s ease;
        }
        .tab-btn img { width: 28px; height: 28px; object-fit: contain; }
        .tab-btn:hover { background: rgba(2, 132, 199, 0.15); border-color: var(--primary-color); }
        .tab-btn.active { 
            background: linear-gradient(135deg, var(--tab-active), var(--primary-color)); 
            border-color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        .content-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; align-items: center; }
        .panel-content { display: none; width: 100%; }
        .panel-content.active { display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تنسيقات قسم نبض العدة المطور (Social Feed) */
        .feed-container { width: 100%; display: flex; flex-direction: column; gap: 16px; margin-bottom: 40px; }
        
        .composer-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .composer-header { display: flex; gap: 12px; align-items: flex-start; }
        .user-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-gold); flex-shrink: 0; }
        .composer-input-area { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .composer-textarea {
            width: 100%;
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            resize: none;
            min-height: 90px;
            outline: none;
            transition: border-color 0.2s;
        }
        .composer-textarea:focus { border-color: var(--primary-color); }
        .composer-footer { display: flex; justify-content: space-between; align-items: center; }
        .char-counter { font-size: 12px; color: var(--text-muted); }
        .publish-btn {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .publish-btn:hover { background: var(--primary-hover); }
        .publish-btn:active { transform: scale(0.96); }
        .publish-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* تصميم منشورات نبض العدة (Feed Posts) */
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .post-card:hover { border-color: rgba(2, 132, 199, 0.3); }

        .social-activity-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 4px;
        }
        .social-activity-banner i { color: var(--accent-gold); }

        .post-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .post-author-info { display: flex; gap: 12px; align-items: center; }
        .post-author-names { display: flex; flex-direction: column; }
        .post-display-name { font-weight: 700; font-size: 15px; color: var(--text-color); }
        .post-username { font-size: 13px; color: var(--text-muted); }
        .post-time { font-size: 12px; color: var(--text-muted); }

        .post-content { font-size: 15px; line-height: 1.7; color: #f1f5f9; word-break: break-word; }
        
        /* بطاقة الاقتباس الداخلية (Quote / Repost with comment) */
        .quoted-card {
            background: rgba(13, 17, 23, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .quoted-header { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent-gold); font-weight: 700; }
        .quoted-header img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }

        /* شريط التفاعل السفلي (Action Bar) */
        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
        }
        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-color); }
        
        .action-btn.reply-btn:hover { color: var(--primary-color); background: rgba(2, 132, 199, 0.1); }
        .action-btn.repost-btn:hover { color: var(--green); background: rgba(35, 134, 54, 0.1); }
        .action-btn.repost-btn.active { color: var(--green); }
        .action-btn.like-btn:hover { color: #f43f5e; background: rgba(244, 63, 94, 0.1); }
        .action-btn.like-btn.active { color: #f43f5e; }
        
        /* تفعيل تأثير الإعجاب الحي Animation */
        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .liked-anim { animation: heartPulse 0.3s ease; }

        /* الردود (Threads) */
        .threads-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .reply-item {
            background: rgba(13, 17, 23, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .reply-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .reply-body { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .reply-author { font-size: 13px; font-weight: 700; color: var(--accent-gold); }
        .reply-text { font-size: 13px; color: #e2e8f0; }

        .reply-input-box {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .reply-input {
            flex-grow: 1;
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .reply-send-btn {
            background: var(--primary-color);
            border: none;
            color: #fff;
            padding: 0 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        /* Modal / Bottom Sheet للقوائم والخيارات */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            animation: fadeIn 0.2s ease;
        }
        @media(min-width: 768px) {
            .modal-overlay { align-items: center; }
        }
        .modal-sheet {
            background: #161b22;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        @media(min-width: 768px) {
            .modal-sheet { border-radius: 24px; }
        }
        .sheet-option {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sheet-option:hover { background: rgba(2, 132, 199, 0.2); border-color: var(--primary-color); }
        .sheet-cancel { background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.2); color: #f43f5e; }

        /* تذييل الصفحة Footer */
        .site-footer {
            margin-top: 40px;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            border-top: 1px solid var(--border-color);
        }
        .x-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .x-link:hover { color: var(--text-color); }
        .x-link svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>

        };

        function switchTab(tabId, event) {
            document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('panel-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('active-tab-logo').src = logoMap[tabId];
        }

        // --- نظام نبض العدة (Social Feed & Interactions) ---
        /*
         * ملاحظة هامة حول الـ Backend:
         * البيانات أدناه مخزنة حالياً محلياً (LocalStorage) للعمل التجريبي الفوري على المتصفح.
         * في حال الرغبة بربطها بقاعدة بيانات حقيقية (Backend مثل Node.js / PHP / Firebase / Supabase)
         * يجب استبدال وظائف التخزين المحلية (localStorage) بطلبات Fetch API إلى الـ Endpoints الخاصة بالخادم
         * لنشر المنشورات، تسجيل الإعجابات، وعمليات إعادة النشر لجميع المستخدمين على مستوى النظام.
         */

        const defaultAvatar = "https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/numbered.png";
        
        let initialSamplePosts = [
            {
                id: 1,
                authorName: "سلطان",
                username: "@Num1bered",
                avatar: defaultAvatar,
                time: "منذ ساعة",
                content: "كل لحظة.. لها أثر مبارك في طاعة الله وعمارة الأرض. استمروا في ذكر الله.",
                likes: 12,
                reposts: 3,
                replies: [
                    { author: "عبدالله", avatar: defaultAvatar, text: "صدقت يا سلطان، بارك الله في جهودك." }
                ],
                isLiked: false,
                isReposted: false,
                socialActivity: "أعجبك وأعاد آخرون نشره"
            },
            {
                id: 2,
                authorName: "فريق معدودات",
                username: "@NumberedApp",
                avatar: defaultAvatar,
                time: "منذ 3 ساعات",
                content: "تم تحديث قسم الأذكار ونبض العدة ليمنحكم تجربة تفاعلية سلسة ومميزة تشبه منصات التواصل الحديثة.",
                likes: 25,
                reposts: 7,
                replies: [],
                isLiked: false,
                isReposted: false,
                socialActivity: null
            }
        ];

        function getStoredPosts() {
            let stored = localStorage.getItem('nabd_posts_v2');
            if (!stored) {
                localStorage.setItem('nabd_posts_v2', JSON.stringify(initialSamplePosts));
                return initialSamplePosts;
            }
            return JSON.parse(stored);
        }

        function saveStoredPosts(posts) {
            localStorage.setItem('nabd_posts_v2', JSON.stringify(posts));
        }

        function updateCharCount(textarea) {
            const count = 280 - textarea.value.length;
            document.getElementById('charCounter').innerText = count;
        }

        function createNewPost() {
            const textInput = document.getElementById('newPostText');
            const text = textInput.value.trim();
            if (!text) return;

            let posts = getStoredPosts();
            let newPost = {
                id: Date.now(),
                authorName: "أنت (زائر الموقع)",
                username: "@Visitor",
                avatar: defaultAvatar,
                time: "الآن",
                content: text,
                likes: 0,
                reposts: 0,
                replies: [],
                isLiked: false,
                isReposted: false,
                socialActivity: null
            };

            posts.unshift(newPost);
            saveStoredPosts(posts);
            textInput.value = '';
            document.getElementById('charCounter').innerText = '280';
            loadPostsFeed();
        }

        function loadPostsFeed() {
            let posts = getStoredPosts();
            let container = document.getElementById('postsFeedList');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted);">لا توجد منشورات حالياً. كن أول من يكتب نبضاً!</div>`;
                return;
            }

            posts.forEach(post => {
                let card = document.createElement('div');
                card.className = 'post-card';

                let activityHtml = '';
                if (post.socialActivity || post.isLiked || post.isReposted) {
                    let actText = post.socialActivity || (post.isLiked && post.isReposted ? "أعجبك وأعدت نشر هذا" : post.isLiked ? "أعجبك هذا المنشور" : "أعدت نشر هذا المنشور");
                    activityHtml = `
                        <div class="social-activity-banner">
                            <i class="fa-solid fa-bolt"></i>
                            <span>${actText}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${activityHtml}
                    <div class="post-top">
                        <div class="post-author-info">
                            <img src="${post.avatar}" alt="أيقونة المستخدم" class="user-avatar" style="width: 40px; height: 40px;" crossorigin="anonymous">
                            <div class="post-author-names">
                                <span class="post-display-name">${post.authorName}</span>
                                <span class="post-username">${post.username}</span>
                            </div>
                        </div>
                        <span class="post-time">${post.time}</span>
                    </div>

                    <div class="post-content">${escapeHtml(post.content)}</div>

                    ${post.quotedPost ? `
                        <div class="quoted-card">
                            <div class="quoted-header">
                                <img src="${post.quotedPost.avatar}" alt="صورة" crossorigin="anonymous">
                                <span>${post.quotedPost.authorName} (${post.quotedPost.username})</span>
                            </div>
                            <div style="font-size: 14px; color: #cbd5e1;">${escapeHtml(post.quotedPost.content)}</div>
                        </div>
                    ` : ''}

                    <div class="threads-section" id="threads-${post.id}" ${post.replies && post.replies.length > 0 ? '' : 'style="display:none;"'}>
                        ${(post.replies || []).map(r => `
                            <div class="reply-item">
                                <img src="${r.avatar}" alt="رد" class="reply-avatar" crossorigin="anonymous">
                                <div class="reply-body">
                                    <span class="reply-author">${r.author}</span>
                                    <span class="reply-text">${escapeHtml(r.text)}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="reply-input-box" id="replyBox-${post.id}" style="display:none;">
                        <input type="text" class="reply-input" id="replyInput-${post.id}" placeholder="اكتب ردك...">
                        <button class="reply-send-btn" onclick="submitReply(${post.id})">إرسال</button>
                    </div>

                    <div class="post-actions">
                        <button class="action-btn reply-btn" onclick="toggleReplyBox(${post.id})">
                            <i class="fa-regular fa-comment"></i>
                            <span>${post.replies ? post.replies.length : 0}</span>
                        </button>
                        <button class="action-btn repost-btn ${post.isReposted ? 'active' : ''}" onclick="openRepostMenu(${post.id})">
                            <i class="fa-solid fa-retweet"></i>
                            <span>${post.reposts}</span>
                        </button>
                        <button class="action-btn like-btn ${post.isLiked ? 'active' : ''}" onclick="toggleLike(${post.id}, event)">
                            <i class="${post.isLiked ? 'fa-solid fa-heart liked-anim' : 'fa-regular fa-heart'}"></i>
                            <span>${post.likes}</span>
                        </button>
                        <button class="action-btn" onclick="openMoreOptions(${post.id})">
                            <i class="fa-solid fa-ellipsis"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // تفاعل الإعجاب الفوري (Optimistic UI)
        function toggleLike(postId, event) {
            let posts = getStoredPosts();
            let post = posts.find(p => p.id === postId);
            if (!post) return;

            if (post.isLiked) {
                post.likes = Math.max(0, post.likes - 1);
                post.isLiked = false;
                post.socialActivity = null;
            } else {
                post.likes += 1;
                post.isLiked = true;
                post.socialActivity = "أعجبك";
            }

            saveStoredPosts(posts);
            loadPostsFeed();
        }

        // فتح خيارات إعادة النشر (Bottom Sheet)
        function openRepostMenu(postId) {
            let overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-sheet">
                    <div class="sheet-option" onclick="doSimpleRepost(${postId})">إعادة نشر فوريّة</div>
                    <div class="sheet-option" onclick="openQuoteModal(${postId})">إعادة نشر مع تعليق (اقتباس)</div>
                    <div class="sheet-option sheet-cancel" onclick="this.closest('.modal-overlay').remove()">إلغاء</div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function doSimpleRepost(postId) {
            document.querySelector('.modal-overlay')?.remove();
            let posts = getStoredPosts();
            let post = posts.find(p => p.id === postId);
            if (!post) return;

            if (post.isReposted) {
                post.reposts = Math.max(0, post.reposts - 1);
                post.isReposted = false;
                post.socialActivity = null;
            } else {
                post.reposts += 1;
                post.isReposted = true;
                post.socialActivity = "أعدت نشر هذا المنشور";
            }

            saveStoredPosts(posts);
            loadPostsFeed();
        }

        // إعادة النشر مع تعليق (اقتباس)
        function openQuoteModal(postId) {
            document.querySelector('.modal-overlay')?.remove();
            let overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-sheet">
                    <h3 style="color:#fff; font-size:16px; margin-bottom:5px;">إعادة نشر مع تعليق</h3>
                    <textarea id="quoteCommentText" class="composer-textarea" placeholder="اكتب تعليقك على هذا المنشور..."></textarea>
                    <div style="display:flex; gap:10px; justify-content:flex-end;">
                        <button class="sheet-option sheet-cancel" style="padding:10px 20px;" onclick="this.closest('.modal-overlay').remove()">إلغاء</button>
                        <button class="publish-btn" onclick="submitQuote(${postId})">نشر الاقتباس</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function submitQuote(postId) {
            let text = document.getElementById('quoteCommentText').value.trim();
            if (!text) return;
            document.querySelector('.modal-overlay')?.remove();

            let posts = getStoredPosts();
            let originalPost = posts.find(p => p.id === postId);
            if (!originalPost) return;

            let quotedPostObj = {
                id: Date.now(),
                authorName: "أنت",
                username: "@Visitor",
                avatar: defaultAvatar,
                time: "الآن",
                content: text,
                likes: 0,
                reposts: 0,
                replies: [],
                isLiked: false,
                isReposted: false,
                socialActivity: "أعدت نشر هذا المنشور مع تعليق",
                quotedPost: originalPost
            };

            posts.unshift(quotedPostObj);
            saveStoredPosts(posts);
            loadPostsFeed();
        }

        // إدارة الردود (Threads)
        function toggleReplyBox(postId) {
            let box = document.getElementById(`replyBox-${postId}`);
            if (box) {
                box.style.display = box.style.display === 'none' ? 'flex' : 'none';
            }
        }

        function submitReply(postId) {
            let input = document.getElementById(`replyInput-${postId}`);
            let text = input.value.trim();
            if (!text) return;

            let posts = getStoredPosts();
            let post = posts.find(p => p.id === postId);
            if (!post) return;

            if (!post.replies) post.replies = [];
            post.replies.push({
                author: "أنت",
                avatar: defaultAvatar,
                text: text
            });

            saveStoredPosts(posts);
            input.value = '';
            loadPostsFeed();
        }

        function openMoreOptions(postId) {
            alert("خيارات المنشور إضافية (مشاركة الرابط، الإبلاغ، إلخ)");
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
