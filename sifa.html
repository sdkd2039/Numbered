<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- إعدادات تطبيق PWA الأساسية -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    
    <!-- دعم نظام iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="نبض العدة">

    <title>نبض العدة</title>

    <!-- وسوم المشاركة -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="نبض العدة">
    <meta property="og:description" content="كل لحظة.. لها أثر">
    <meta property="og:image" content="https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/throb%20equipment.png">
    <meta property="og:url" content="https://numbered.casacam.net/pulse.html">
    <meta property="og:site_name" content="معدودات">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @font-face {
            font-family: 'TheYearofHandicrafts';
            src: url('https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/TheYearofHandicrafts-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.75);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #c5a880;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'TheYearofHandicrafts', 'Tajawal', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(2, 132, 199, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(197, 168, 128, 0.06) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* شاشة البداية المتحركة (Splash Screen) */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .splash-logo {
            width: 150px;
            height: auto;
            animation: pulseLogo 1.5s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        img { pointer-events: none; -webkit-touch-callout: none; }
        
        header { text-align: center; margin-bottom: 25px; }
        .main-logo { max-width: 130px; height: auto; }

        .main-wrapper {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .box-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color); 
            border-radius: 24px; 
            padding: 24px; 
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1); 
        }

        .box-header { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 12px; 
            margin-bottom: 18px; 
        }
        .box-title { font-size: 1.3rem; color: var(--accent-gold); font-weight: 800; }

        .pulse-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .pulse-post-card {
            background: rgba(13, 17, 23, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .pulse-post-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .pulse-post-text {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #f8fafc;
            white-space: pre-line;
        }

        .pulse-post-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .pulse-share-btn {
            background: rgba(197, 168, 128, 0.1);
            border: 1px solid rgba(197, 168, 128, 0.3);
            color: var(--accent-gold);
            padding: 11px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .pulse-share-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }
        .pulse-share-btn:active { transform: scale(0.97); }

        /* نافذة خيارات المشاركة */
        .share-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .share-modal-overlay.open { opacity: 1; visibility: visible; }
        .share-modal-card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            width: 90%;
            max-width: 360px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            transform: scale(0.93);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .share-modal-overlay.open .share-modal-card { transform: scale(1); }
        .share-modal-title { font-size: 1.15rem; font-weight: 800; color: #fff; margin-bottom: 18px; }
        .share-platforms-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .platform-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 13px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.15s ease, background 0.2s ease;
        }
        .platform-btn.x-platform { background: rgba(0, 0, 0, 0.6); color: #fff; }
        .platform-btn.x-platform:hover { background: rgba(0, 0, 0, 0.8); }
        .platform-btn.tg-platform { background: rgba(34, 158, 217, 0.25); color: #229ed9; border-color: rgba(34, 158, 217, 0.4); }
        .platform-btn.tg-platform:hover { background: rgba(34, 158, 217, 0.4); color: #fff; }
        .platform-btn.wa-platform { background: rgba(37, 211, 102, 0.25); color: #25d366; border-color: rgba(37, 211, 102, 0.4); }
        .platform-btn.wa-platform:hover { background: rgba(37, 211, 102, 0.4); color: #fff; }
        .platform-btn.copy-platform { background: rgba(197, 168, 128, 0.15); color: #c5a880; border-color: rgba(197, 168, 128, 0.3); }
        .platform-btn.copy-platform:hover { background: rgba(197, 168, 128, 0.3); color: #fff; }
        .platform-btn:active { transform: scale(0.96); }
        
        .share-modal-close {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 11px;
            border-radius: 14px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .share-modal-close:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

        .site-footer {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            margin-top: auto;
        }

        .x-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .x-link:hover { color: #ffffff; background: rgba(0, 0, 0, 0.6); }
        
        button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body oncontextmenu="return false;">

<!-- شاشة البداية المتحركة -->
<div id="splashScreen">
    <img src="https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/throb%20equipment.png" alt="شعار نبض العدة" class="splash-logo" ondragstart="return false;">
</div>

<header>
    <a href="index.html">
        <img src="https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/throb%20equipment.png" class="main-logo" alt="نبض العدة">
    </a>
</header>
    
<div class="main-wrapper">
    <div class="box-card">
        <div class="box-header">
            <i class="fa-solid fa-heart-pulse" style="color: var(--accent-gold); font-size: 1.3rem;"></i>
            <h2 class="box-title">نبض العدة</h2>
        </div>
        <div class="pulse-container" id="pulse-container">
            <p style="text-align:center; color:gray; padding: 25px;">جاري جلب المنشورات من ورقة نبض العدة...</p>
        </div>
    </div>
</div>

<!-- نافذة المشاركة المنبثقة -->
<div id="shareModal" class="share-modal-overlay" onclick="closeShareModal(event)">
    <div class="share-modal-card" onclick="event.stopPropagation()">
        <div class="share-modal-title">اختر طريقة المشاركة</div>
        <div class="share-platforms-grid">
            <button class="platform-btn x-platform" onclick="executePlatformShare('x')">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                <span>اكس</span>
            </button>
            <button class="platform-btn tg-platform" onclick="executePlatformShare('telegram')">
                <i class="fa-brands fa-telegram" style="font-size: 1.1rem;"></i>
                <span>تليجـرام</span>
            </button>
            <button class="platform-btn wa-platform" onclick="executePlatformShare('whatsapp')">
                <i class="fa-brands fa-whatsapp" style="font-size: 1.1rem;"></i>
                <span>واتسـاب</span>
            </button>
            <button class="platform-btn copy-platform" onclick="executePlatformShare('copy')">
                <i class="fa-regular fa-copy" style="font-size: 1.1rem;"></i>
                <span>نسخ فقط دون مشاركة</span>
            </button>
        </div>
        <button class="share-modal-close" onclick="closeShareModal()">إلغاء</button>
    </div>
</div>

<footer class="site-footer">
    <a href="https://x.com/Num1bered" target="_blank" rel="noopener noreferrer" class="x-link">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        <span>تابعنا على منصة X</span>
    </a>
</footer>

<script>
    window.addEventListener('load', () => {
        const splash = document.getElementById('splashScreen');
        if (splash) {
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 400);
            }, 1200);
        }
    });

    const SPREADSHEET_ID = '1BN23aKIJllQ_qKqilgbeugD2qOlf8exUPa4oftKVZrQ';
    let pulseData = [];
    let activeShareText = '';

    async function fetchPulseData() {
        try {
            // تحديد ورقة العمل بدقة عبر البارامتر sheet=نبض_العدة
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=نبض_العدة`;
            const res = await fetch(url).then(r => r.text());
            const jsonText = res.substring(res.indexOf('{'), res.lastIndexOf(')'));
            const json = JSON.parse(jsonText);

            pulseData = json.table.rows.map(r => ({
                title: r.c[0]?.v || '',
                text: r.c[1]?.v || '',
                image: r.c[2]?.v || ''
            })).reverse();

            renderPulse();
        } catch (e) {
            console.error('خطأ في جلب بيانات نبض العدة:', e);
            document.getElementById('pulse-container').innerHTML = `<p style="text-align:center; color: #ef4444; padding: 20px;">تعذر جلب المنشورات من ورقة "نبض_العدة"، تأكد من مطابقة اسم الورقة في الملف.</p>`;
        }
    }

    function renderPulse() {
        const container = document.getElementById('pulse-container');
        if (!container) return;
        
        if (!pulseData || pulseData.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:gray; padding: 20px;">لا توجد منشورات حالياً في نبض العدة.</p>`;
            return;
        }

        container.innerHTML = pulseData.map((post, index) => `
            <div class="pulse-post-card">
                <div class="pulse-post-title">${post.title}</div>
                <div class="pulse-post-text">${post.text}</div>
                ${post.image ? `<img src="${post.image}" class="pulse-post-image" alt="صورة المنشور">` : ''}
                <button class="pulse-share-btn" onclick="openShareModal(${index})">
                    <i class="fa-solid fa-share-nodes"></i> مشاركة المنشور
                </button>
            </div>
        `).join('');
    }

    function openShareModal(index) {
        const post = pulseData[index];
        if (!post) return;
        const siteUrl = 'https://numbered.casacam.net/pulse.html';
        activeShareText = `${post.title}\n\n${post.text}\n\n🔗 ${siteUrl}`;
        document.getElementById('shareModal').classList.add('open');
    }

    function closeShareModal() {
        document.getElementById('shareModal').classList.remove('open');
    }

    async function executePlatformShare(platform) {
        if (!activeShareText) return;
        const encodedText = encodeURIComponent(activeShareText);

        if (platform === 'copy') {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(activeShareText);
                    alert("تم نسخ النص بنجاح إلى الحافظة!");
                } catch(e) {
                    alert("تعذر النسخ تلقائياً.");
                }
            }
            closeShareModal();
            return;
        }

        let url = '';
        if (platform === 'x') {
            url = `https://twitter.com/intent/tweet?text=${encodedText}`;
        } else if (platform === 'whatsapp') {
            url = `https://api.whatsapp.com/send?text=${encodedText}`;
        } else if (platform === 'telegram') {
            url = `https://t.me/share/url?url=${encodeURIComponent('https://numbered.casacam.net/pulse.html')}&text=${encodedText}`;
        }

        closeShareModal();
        if (url) {
            window.open(url, '_blank');
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        fetchPulseData();
    });
</script>

</body>
</html>
