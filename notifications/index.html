<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b14"><title>مركز الإشعارات | معدودات</title>
<style>
:root{color-scheme:dark;--bg:#090b14;--panel:#141725;--panel2:#0d1120;--line:#30364d;--muted:#9298ae;--text:#f4f4fb;--accent:#796dff;--green:#8ff0bd;--red:#ffb5c2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#222044 0,transparent 55%),var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:16px;min-height:100vh}
.wrap{max-width:1000px;margin:auto}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}header img{width:54px;height:54px;object-fit:contain}header h1{font-size:23px;margin:0}header p{color:var(--muted);font-size:12px;margin:5px 0 0}.grow{flex:1}.panel{background:var(--panel);border:1px solid #292e43;border-radius:18px;padding:18px;margin-bottom:14px}
input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:white}textarea{min-height:110px;resize:vertical;line-height:1.8}
label{display:block;font-size:13px;color:#dedff0;margin:12px 0 7px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.btn{border:0;border-radius:10px;padding:11px 15px;background:linear-gradient(135deg,#796dff,#5145c8);color:white;cursor:pointer}.btn.alt{background:#252044;border:1px solid #514b91;color:#d4d0ff}.btn.danger{background:#842d43}.btn:disabled{opacity:.55;cursor:not-allowed}
.tabs{display:flex;gap:7px;margin:14px 0}.tab{flex:1;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:#c8c6e9}.tab.active{background:#29234d;border-color:var(--accent);color:white}.view{display:none}.view.active{display:block}
.status{margin-top:12px;font-size:13px;line-height:1.8}.ok{color:var(--green)}.err{color:var(--red)}.item{padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);margin-top:10px}.item h3{margin:0 0 6px;font-size:15px}.meta{color:var(--muted);font-size:11px;margin:6px 0}.item p{white-space:pre-wrap;line-height:1.7;color:#c8cadd;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button,.actions a{font-size:12px;text-decoration:none}
.hidden{display:none!important}.hint{font-size:12px;color:var(--muted);line-height:1.8}.link{color:#c9c2ff}
@media(max-width:560px){body{padding:10px}header h1{font-size:19px}.panel{padding:13px}.tabs{position:sticky;top:0;z-index:3;background:#090b14;padding:5px}.tab{font-size:12px}}
</style>
</head>
<body><main class="wrap">
<header><img src="https://file.garden/aoLQp-Z9knG33grX/شعارات%20الصور/numbered.png" alt=""><div><h1>مركز الإشعارات</h1><p>إرسال وجدولة الإشعارات وإدارة الأرشيف والملفات</p></div><span class="grow"></span><a class="btn alt" href="/hub.html">مركز إدارة معدودات</a></header>
<section class="panel">
<label for="adminToken">رمز الإدارة</label><div class="row"><input id="adminToken" type="password" autocomplete="off" placeholder="أدخل ADMIN_TOKEN"><button id="saveToken" class="btn">حفظ مؤقتًا</button><button id="clearToken" class="btn alt">مسح</button></div>
<p class="hint">يُحفظ الرمز في جلسة المتصفح الحالية فقط، ولا يُرسل إلى GitHub.</p><div id="globalStatus" class="status"></div>
</section>
<nav class="tabs"><button class="tab active" data-view="compose">إرسال إشعار</button><button class="tab" data-view="archive">الأرشيف</button><button class="tab" data-view="files">مركز الملفات</button></nav>
<section id="compose" class="view active panel">
<h2>إنشاء إشعار</h2>
<form id="sendForm">
<label for="title">عنوان الإشعار</label><input id="title" name="title" maxlength="100" required>
<label for="message">نص الإشعار</label><textarea id="message" name="message" maxlength="500" required></textarea>
<label for="url">رابط الوجهة (اختياري)</label><input id="url" name="url" type="url" placeholder="https://">
<label for="image_url">رابط الصورة (اختياري)</label><input id="image_url" name="image_url" type="url" placeholder="https://">
<label>موعد الإرسال</label><div class="row"><label><input type="radio" name="schedule_mode" value="now" checked style="width:auto"> إرسال الآن</label><label><input type="radio" name="schedule_mode" value="later" style="width:auto"> جدولة لاحقًا</label></div>
<div id="scheduleFields" class="hidden"><label for="sendDate">التاريخ</label><input id="sendDate" type="date"><label for="sendTime">الوقت</label><input id="sendTime" type="time"><p class="hint">يُفسّر الموعد حسب توقيت جهازك، ثم يُرسل إلى OneSignal كتوقيت ISO.</p></div>
<div class="row" style="margin-top:16px"><button class="btn" id="sendBtn" type="submit">إرسال الإشعار</button><button class="btn alt" id="clearForm" type="button">تفريغ الحقول</button></div>
</form><div id="sendStatus" class="status"></div>
</section>
<section id="archive" class="view panel"><div class="row"><h2 class="grow">أرشيف الإشعارات</h2><button id="refreshArchive" class="btn alt">تحديث</button></div><div id="archiveList"><p class="hint">أدخل رمز الإدارة ثم اضغط تحديث.</p></div></section>
<section id="files" class="view panel"><div class="row"><h2 class="grow">مركز الملفات</h2><button id="refreshFiles" class="btn alt">تحديث</button></div>
<form id="uploadForm"><label for="file">اختر صورة أو فيديو أو PDF (حتى 25 MB)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/mp4,video/webm,application/pdf" required>
<label>مدة الرابط</label><select id="expiry"><option value="1d">يوم واحد</option><option value="7d" selected>7 أيام</option><option value="30d">30 يومًا</option><option value="90d">90 يومًا</option><option value="forever">دائم حتى الحذف</option></select>
<button class="btn" style="margin-top:14px" id="uploadBtn">رفع الملف</button></form><div id="fileStatus" class="status"></div><div id="filesList"></div></section>
</main>
<script>
const API="https://numbered-notify.sultan2021alamoudi.workers.dev";
const $=id=>document.getElementById(id);
let token="";
try{token=sessionStorage.getItem("numbered_admin_token")||""}catch{}
$("adminToken").value=token;
function status(id,msg,ok=false){$(id).textContent=msg;$(id).className="status "+(ok?"ok":"err")}
function auth(){token=$("adminToken").value.trim();if(!token){status("globalStatus","أدخل رمز الإدارة أولًا.");return false}return true}
function formData(obj){const fd=new FormData();Object.entries(obj).forEach(([k,v])=>fd.set(k,v));return fd}
async function postForm(fd){const r=await fetch(API+"/",{method:"POST",body:fd});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.success)throw Error(d.message||"تعذر تنفيذ الطلب");return d}
async function getJson(path){const r=await fetch(API+path,{headers:{"X-Admin-Token":token}});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.success)throw Error(d.message||"تعذر جلب البيانات");return d}
$("saveToken").onclick=()=>{if(!auth())return;try{sessionStorage.setItem("numbered_admin_token",token)}catch{}status("globalStatus","تم حفظ الرمز لهذه الجلسة.",true)};
$("clearToken").onclick=()=>{token="";$("adminToken").value="";try{sessionStorage.removeItem("numbered_admin_token")}catch{}status("globalStatus","تم مسح الرمز من الجلسة.",true)};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===b.dataset.view));if(b.dataset.view==="archive")loadArchive();if(b.dataset.view==="files")loadFiles()});
document.querySelectorAll('[name="schedule_mode"]').forEach(x=>x.onchange=()=>{$("scheduleFields").classList.toggle("hidden",document.querySelector('[name="schedule_mode"]:checked').value!=="later");$("sendBtn").textContent=document.querySelector('[name="schedule_mode"]:checked').value==="later"?"جدولة الإشعار":"إرسال الإشعار"});
$("sendForm").onsubmit=async e=>{e.preventDefault();if(!auth())return;const mode=document.querySelector('[name="schedule_mode"]:checked').value;let sendAfter="";if(mode==="later"){if(!$("sendDate").value||!$("sendTime").value)return status("sendStatus","حدد التاريخ والوقت.");const dt=new Date($("sendDate").value+"T"+$("sendTime").value);if(!Number.isFinite(dt.getTime())||dt.getTime()<=Date.now()+60000)return status("sendStatus","اختر موعدًا بعد دقيقة على الأقل.");sendAfter=dt.toISOString()}const data={action:"send",token,title:$("title").value.trim(),message:$("message").value.trim(),url:$("url").value.trim(),image_url:$("image_url").value.trim(),schedule_mode:mode,send_after:sendAfter};$("sendBtn").disabled=true;try{const d=await postForm(formData(data));status("sendStatus",d.message||"تم تنفيذ الطلب.",true);await loadArchive()}catch(err){status("sendStatus",err.message)}finally{$("sendBtn").disabled=false}};
$("clearForm").onclick=()=>{$("sendForm").reset();$("scheduleFields").classList.add("hidden");$("sendBtn").textContent="إرسال الإشعار";$("sendStatus").textContent=""};
async function loadArchive(){if(!auth())return;const box=$("archiveList");box.textContent="جارٍ التحميل…";try{const d=await getJson("/?action=archive");if(!d.items?.length){box.innerHTML='<p class="hint">لا توجد إشعارات في الأرشيف.</p>';return}box.replaceChildren(...d.items.map(item=>{const el=document.createElement("article");el.className="item";const h=document.createElement("h3");h.textContent=item.title||"إشعار بدون عنوان";const p=document.createElement("p");p.textContent=item.message||"";const meta=document.createElement("div");meta.className="meta";meta.textContent=(item.statusLabel||item.status||"")+" · "+(item.createdLabel||"");const actions=document.createElement("div");actions.className="actions";const del=document.createElement("button");del.className="btn danger";del.textContent="حذف";del.onclick=()=>deleteArchive(item.key);const repeat=document.createElement("button");repeat.className="btn alt";repeat.textContent="إعادة استخدام";repeat.onclick=()=>{ $("title").value=item.title||"";$("message").value=item.message||"";$("url").value=item.url||"";$("image_url").value=item.imageURL||"";document.querySelector('[data-view="compose"]').click()};actions.append(repeat,del);el.append(h,p,meta,actions);return el}))}catch(e){box.textContent=e.message}}
async function deleteArchive(key){if(!confirm("هل تريد حذف هذا الإشعار من الأرشيف؟"))return;if(!auth())return;try{const d=await postForm(formData({action:"delete",token,key}));status("globalStatus",d.message,true);await loadArchive()}catch(e){status("globalStatus",e.message)}}
$("refreshArchive").onclick=loadArchive;
async function loadFiles(){if(!auth())return;const box=$("filesList");box.textContent="جارٍ تحميل الملفات…";try{const d=await getJson("/?action=files");if(!d.items?.length){box.innerHTML='<p class="hint">لا توجد ملفات مرفوعة.</p>';return}box.replaceChildren(...d.items.map(x=>{const el=document.createElement("article");el.className="item";const h=document.createElement("h3");h.textContent=x.name;const p=document.createElement("p");p.textContent=x.sizeLabel+" · "+x.expiryLabel;const a=document.createElement("a");a.href=x.url;a.target="_blank";a.rel="noopener";a.className="link";a.textContent="فتح الملف";const copy=document.createElement("button");copy.className="btn alt";copy.textContent="نسخ الرابط";copy.onclick=()=>navigator.clipboard.writeText(x.url);const del=document.createElement("button");del.className="btn danger";del.textContent="حذف";del.onclick=()=>deleteFile(x.id);const actions=document.createElement("div");actions.className="actions";actions.append(a,copy,del);el.append(h,p,actions);return el}))}catch(e){box.textContent=e.message}}
$("refreshFiles").onclick=loadFiles;
$("uploadForm").onsubmit=async e=>{e.preventDefault();if(!auth())return;const file=$("file").files[0];if(!file)return status("fileStatus","اختر ملفًا.");if(file.size>25*1024*1024)return status("fileStatus","حجم الملف يتجاوز 25 ميجابايت.");const fd=formData({action:"file-upload",token,expiry:$("expiry").value});fd.set("file",file);$("uploadBtn").disabled=true;try{const d=await postForm(fd);status("fileStatus",d.message+" "+d.url,true);await loadFiles();$("uploadForm").reset()}catch(err){status("fileStatus",err.message)}finally{$("uploadBtn").disabled=false}};
async function deleteFile(id){if(!confirm("حذف الملف نهائيًا؟"))return;if(!auth())return;try{const d=await postForm(formData({action:"file-delete",token,id}));status("fileStatus",d.message,d.success);await loadFiles()}catch(e){status("fileStatus",e.message)}}
</script></body></html>
