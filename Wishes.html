<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهاني المناسبات</title>
    <!-- شعار الموقع في رأس الصفحة (Favicon) -->
    <link rel="icon" href="https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/congrad.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* تعريف الخط المخصص المرفوع على File Garden */
        @font-face {
            font-family: 'CamelFont';
            src: url('https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/TheYearofTheCamel-Bold.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        :root { --primary: #3498db; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { font-family: 'CamelFont', 'Cairo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; }
        .logo { max-width: 180px; height: auto; margin-bottom: 10px; }
        .subtitle { font-size: 1.2rem; color: #b0b0b0; margin-top: 0; margin-bottom: 20px; }
        .input-group { text-align: right; margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #ddd; }
        .grid-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .option-card { padding: 15px; text-align: center; background: #333; border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .option-card.active { border-color: var(--primary); background: #444; }
        .controls { display: grid; gap: 15px; margin-top: 20px; text-align: right; }
        input[type="range"], input[type="text"] { width: 100%; cursor: pointer; box-sizing: border-box; }
        input[type="text"] { padding: 10px; border-radius: 5px; border: none; background: #2a2a2a; color: white; font-family: 'CamelFont', 'Cairo', sans-serif; font-size: 1.1rem; }
        button { padding: 12px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; font-family: 'CamelFont', 'Cairo', sans-serif; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #canvas { width: 100%; margin-top: 20px; border-radius: 15px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .hidden { display: none; }
        .loader { text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
        #toast { position: fixed; bottom: 20px; left: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 5px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div class="container">
    <!-- شعار الموقع في الواجهة -->
    <img src="https://file.garden/aoLQp-Z9knG33grX/%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B5%D9%88%D8%B1/congrad.png" alt="شعار تهاني المناسبات" class="logo">
    <div class="subtitle">شهر رمضان 🌘</div>

    <div class="input-group">
        <label for="nameInput">الاسم:</label>
        <input type="text" id="nameInput" placeholder="اكتب الاسم هنا..." oninput="render()">
    </div>
    
    <div class="input-group" style="text-align: right;">
        <label>اختر التصميم:</label>
    </div>
    <div class="grid-options" id="gallery">
        <div class="option-card" onclick="selectImg(this, 'https://files.catbox.moe/s0weco.png')">تصميم 1</div>
        <div class="option-card" onclick="selectImg(this, 'https://files.catbox.moe/0lsitx.png')">تصميم 2</div>
        <div class="option-card" onclick="selectImg(this, 'https://files.catbox.moe/rtl9tj.png')">تصميم 3</div>
        <div class="option-card" onclick="selectImg(this, 'https://files.catbox.moe/cw2ekb.png')">تصميم 4</div>
        <div class="option-card" onclick="selectImg(this, 'https://files.catbox.moe/5jm04u.png')">تصميم 5</div>
        <div class="option-card" onclick="selectImg(this, 'https://files.catbox.moe/t7anfn.png')">تصميم 6</div>
    </div>

    <div class="controls hidden" id="controlPanel">
        <label>حجم الخط: <input type="range" id="fontSize" min="20" max="200" value="80" oninput="render()"></label>
        <label>الإزاحة الأفقية (X): <input type="range" id="posX" min="0" max="100" value="50" oninput="render()"></label>
        <label>الإزاحة الرأسية (Y): <input type="range" id="posY" min="0" max="100" value="70" oninput="render()"></label>
        <label>لون الخط: <input type="color" id="fontColor" value="#ffffff" oninput="render()" style="width:15%; padding:0; border:none; background:none; cursor:pointer;"></label>
        <button id="downloadBtn" class="hidden" onclick="download()" style="background: #27ae60; margin-top: 10px;">تحميل الصورة</button>
    </div>

    <div id="loader" class="loader hidden">جاري المعالجة...</div>
    <canvas id="canvas"></canvas>
    <div id="toast"></div>
</div>

<script>
    let selectedSrc = "";
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function selectImg(el, src) {
        document.querySelectorAll('.option-card').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        selectedSrc = src;
        document.getElementById('controlPanel').classList.remove('hidden');
        render(); 
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    async function render() {
        const name = document.getElementById('nameInput').value;
        if (!selectedSrc || !name) return;

        document.getElementById('loader').classList.remove('hidden');
        canvas.style.display = 'none';

        // التأكد من تحميل الخط المخصص قبل الرسم لمنع حدوث مشكلة في الـ Canvas
        await document.fonts.load('bold 80px CamelFont');

        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = selectedSrc;
        
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            
            let size = document.getElementById('fontSize').value;
            let finalX = canvas.width * (document.getElementById('posX').value / 100);
            let finalY = canvas.height * (document.getElementById('posY').value / 100);

            // استخدام الخط الجديد المرفوع
            ctx.font = `bold ${size}px CamelFont, Cairo, sans-serif`;
            ctx.fillStyle = document.getElementById('fontColor').value;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            if(ctx.measureText(name).width > canvas.width * 0.9) {
                ctx.font = `bold ${size * 0.7}px CamelFont, Cairo, sans-serif`;
            }

            ctx.fillText(name, finalX, finalY);
            
            document.getElementById('loader').classList.add('hidden');
            canvas.style.display = 'block';
            document.getElementById('downloadBtn').classList.remove('hidden');
        };
    }

    function download() {
        const link = document.createElement('a');
        link.download = `${document.getElementById('nameInput').value || 'تهنئة_رمضان'}.png`;
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
        showToast("تم التحميل بنجاح!");
    }
</script>
</body>
</html>
